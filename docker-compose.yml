services:
  youtube-operational-api:
    build:
      context: ./YouTube-operational-API
    restart: on-failure
    ports:
      - ${YT_API_EXPOSED_HTTP_PORT:-8080}:80
    # Set Apache's ServerName to silence the AH00558 FQDN warning on startup.
    volumes:
      - ./deploy/apache-servername.conf:/etc/apache2/conf-enabled/servername.conf:ro

  keyword-notifier:
    build: .
    depends_on:
      - youtube-operational-api
    env_file:
      - .env
    environment:
      YT_API_BASE_URL: http://youtube-operational-api
    # OAuth callback for YouTube membership verification. Bound to localhost so
    # only the host's nginx can reach it; nginx terminates TLS and proxies to
    # here at GOOGLE_OAUTH_REDIRECT_URI (see deploy/nginx-membership.conf.example).
    # (Internal port must match MEMBERSHIP_OAUTH_PORT, default 8081. If nginx
    # runs in a container instead, drop the 127.0.0.1 and share a network.)
    ports:
      - 127.0.0.1:${MEMBERSHIP_OAUTH_EXPOSED_PORT:-8081}:8081
    volumes:
      - .:/app
    restart: unless-stopped
