services:
  youtube-operational-api:
    build:
      context: ./YouTube-operational-API
    restart: on-failure
    ports:
      - ${YT_API_EXPOSED_HTTP_PORT:-8080}:80
    # Set Apache's ServerName to silence the AH00558 FQDN warning on startup.
    volumes:
      - ./deploy/apache-servername.conf:/etc/apache2/conf-enabled/servername.conf:ro

  keyword-notifier:
    build: .
    depends_on:
      - youtube-operational-api
    env_file:
      - .env
    environment:
      YT_API_BASE_URL: http://youtube-operational-api
    # OAuth callback for YouTube membership verification. Bound to localhost so
    # only the host's nginx can reach it; nginx terminates TLS and proxies to
    # here at GOOGLE_OAUTH_REDIRECT_URI (see deploy/nginx-membership.conf.example).
    ports:
      - 127.0.0.1:${MEMBERSHIP_OAUTH_EXPOSED_PORT:-8081}:${MEMBERSHIP_OAUTH_PORT:-8081}
    volumes:
      - .:/app
      # Live-stream recordings. Bound explicitly so you can point them at a
      # bigger disk via RECORDING_HOST_DIR without moving the whole repo.
      # Keep the container path aligned with RECORDING_OUTPUT_DIR (default
      # "recordings" -> /app/recordings).
      - ${RECORDING_HOST_DIR:-./recordings}:/app/recordings
      # Optional: mount an rclone config to enable /record_upload (cloud upload).
      # Create it once with `rclone config` (e.g. a Google Drive remote), then
      # set RCLONE_CONFIG=/config/rclone.conf and RCLONE_REMOTE in .env.
      # - ${RCLONE_CONFIG_HOST:-./rclone.conf}:/config/rclone.conf:ro
    restart: unless-stopped
