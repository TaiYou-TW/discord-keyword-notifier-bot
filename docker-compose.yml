services:
  youtube-operational-api:
    build:
      context: ./YouTube-operational-API
    restart: on-failure
    ports:
      - ${YT_API_EXPOSED_HTTP_PORT:-8080}:80

  keyword-notifier:
    build: .
    depends_on:
      - youtube-operational-api
    env_file:
      - .env
    environment:
      YT_API_BASE_URL: http://youtube-operational-api
    # OAuth callback for YouTube membership verification. Put a reverse proxy
    # in front of this port to serve it over HTTPS at GOOGLE_OAUTH_REDIRECT_URI.
    # (Internal port must match MEMBERSHIP_OAUTH_PORT, default 8081.)
    ports:
      - ${MEMBERSHIP_OAUTH_EXPOSED_PORT:-8081}:8081
    volumes:
      - .:/app
    restart: unless-stopped
